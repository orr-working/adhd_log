# XcodeGen project definition.
# Mac에서:  brew install xcodegen  →  xcodegen generate  →  open ADHDLog.xcodeproj
#
# 자세한 설정(서명/App Group/iCloud)은 README.md 참고.

name: ADHDLog
options:
  bundleIdPrefix: com.adhdlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # 본인 Apple Developer 팀 ID로 바꾸세요 (없으면 Xcode가 자동 서명 안내).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  ADHDLog:
    type: application
    platform: iOS
    sources:
      - path: ADHDLog
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhdlog.app
        INFOPLIST_FILE: ADHDLog/Info.plist
        CODE_SIGN_ENTITLEMENTS: ADHDLog/ADHDLog.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ADHDLogWidget

  ADHDLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ADHDLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adhdlog.app.widget
        INFOPLIST_FILE: ADHDLogWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ADHDLogWidget/ADHDLogWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
